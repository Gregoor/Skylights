name: Daily index

# Keeps the TMDB index current without re-downloading the ~144 MB store backup: each day emits a small delta (the
# records that changed), and once a week the base is rebuilt from the full store and the deltas it
# folds in are pruned. The metadata store is carried across runs in the Actions cache; because that
# cache evicts after 7 idle days, the store is also published as a release asset and restored from it
# on a cold cache, so a gap costs seconds rather than a ~19h re-backfill.

on:
  schedule:
    # TMDB publishes the exports by ~08:00 UTC; 09:00 leaves an hour of slack.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "delta (small, incremental) or base (rebuild everything)"
        required: false
        default: "delta"
      refetch-limit:
        description: "Records to re-fetch this run (blank = 5000)"
        required: false
        default: ""

concurrency:
  group: daily-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the rolling release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci

      - name: Restore metadata store
        uses: actions/cache/restore@v6
        with:
          path: |
            data/records.ndjson
            data/published.json
          key: tmdb-store-${{ github.run_id }}
          restore-keys: tmdb-store-

      - name: Restore the store from its release asset on a cold cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/records.ndjson ]; then
            mkdir -p data
            gh release download latest -p store.ndjson.gz -D /tmp/store-asset || true
            if [ -f /tmp/store-asset/store.ndjson.gz ]; then
              gunzip -c /tmp/store-asset/store.ndjson.gz > data/records.ndjson
              echo "restored the store from the release asset ($(wc -l < data/records.ndjson) records)"
            else
              echo "no store asset yet — this run seeds from the export"
            fi
          fi

      - name: Decide delta vs base
        id: mode
        run: |
          # A base was 74.5 MB for the Oct 2 store snapshot and every client re-downloads it, so it is rebuilt only when it must be:
          # on a cold cache (no `published.json`, so there is nothing to diff against), on request, or
          # once the delta chain has grown long enough to be worth compacting. A delta can only be
          # applied to the base it was built on, so this cadence is what a client's download costs —
          # weekly is ~3.9 GB/year per client, monthly ~900 MB, and a day is ~1 MB.
          DELTAS=$(curl -sL --max-time 60 \
            "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json" \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('deltas') or []))" \
            2>/dev/null || echo 0)
          FORMAT=$(curl -sL --max-time 60 \
            "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('indexFormatVersion', 0))" \
            2>/dev/null || echo 0)
          node -e "
            import('./Scripts/manifest.mjs').then((m) => {
              const mode = m.decideMode({
                hasMarker: require('fs').existsSync('data/published.json'),
                requested: '${{ inputs.mode }}',
                deltas: Number('${DELTAS:-0}'),
                publishedFormatVersion: Number('${FORMAT:-0}'),
              });
              require('fs').appendFileSync(process.env.GITHUB_OUTPUT, \`mode=\${mode}\n\`);
              console.log('mode=' + mode + ' (' + '${DELTAS:-0}' + ' deltas so far)');
            });
          "

      - name: Test
        run: npm test

      - name: Download today's ID export
        run: npm run fetch-exports

      - name: Fetch new + changed metadata
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          REFETCH="${{ inputs.refetch-limit }}"
          node Scripts/daily-update.mjs --refetch="${REFETCH:-5000}"

      - name: Update IMDb ratings from their bulk file
        run: node Scripts/fetch-imdb-ratings.mjs

      - name: Enrich ratings from OMDb
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [ -z "$OMDB_API_KEY" ]; then
            echo "no OMDB_API_KEY secret — skipping ratings"
          else
            # `--top` is only a cap on how much of the queue is considered: leave it wide so the
            # ordering can reach the whole corpus, and let the budget be the real limit. The budget is
            # the account's daily quota — set the OMDB_DAILY_BUDGET repository variable to raise it
            # (a patron tier), or leave it at the free tier's 1,000.
            node Scripts/fetch-ratings.mjs --top=2000000 \
              --max-requests=${{ vars.OMDB_DAILY_BUDGET || '1000' }} --refresh-days=30
          fi

      - name: Build delta index
        if: steps.mode.outputs.mode == 'delta'
        run: node Scripts/build-delta.mjs data "build/delta-$(date -u +%F).index"

      - name: Build base index
        if: steps.mode.outputs.mode == 'base'
        run: |
          node Scripts/build-index.mjs data build/tmdb.index
          # The base now contains everything, so the delta chain restarts from here.
          node -e "require('fs').writeFileSync('data/published.json', JSON.stringify({since: Date.now()}))"

      # The index suites need a full index, which only a base run produces. They are the perf and
      # retrieval guards, so they hold a base rebuild to the same bar as everything else.
      - name: Verify the index
        if: steps.mode.outputs.mode == 'base'
        run: |
          node test/rank.test.mjs build/tmdb.index
          node test/perf.mjs build/tmdb.index

      - name: Build provider bundle
        run: npm run build-provider

      - name: Compress the store for its release asset
        run: gzip -c data/records.ndjson > build/store.ndjson.gz

      - name: Save metadata store
        uses: actions/cache/save@v6
        with:
          path: |
            data/records.ndjson
            data/published.json
          key: tmdb-store-${{ github.run_id }}

      # After the publish, never before: the marker is what the next delta measures from, and moving it
      # when the delta is only built means a failed publish drops that day's changes from every later
      # delta as well.
      - name: Mark the delta published
        if: steps.mode.outputs.mode == 'delta'
        run: node Scripts/build-delta.mjs data "build/delta-$(date -u +%F).index" --mark-only

      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "base" ]; then
            node Scripts/publish.mjs --base=build/tmdb.index --store=build/store.ndjson.gz
          else
            node Scripts/publish.mjs --delta="build/delta-$(date -u +%F).index" --store=build/store.ndjson.gz
          fi
