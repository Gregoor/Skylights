name: Deploy TMDB search Worker

on:
  push:
    branches: [main]
    paths:
      - "tmdb-search-worker/**"
      - ".github/workflows/deploy-tmdb-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply D1 migrations
        working-directory: tmdb-search-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply skylights-tmdb-search --remote
      - name: Configure Worker data-source secrets
        working-directory: tmdb-search-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          set -eu
          if [ -z "$TMDB_READ_TOKEN" ]; then
            echo "TMDB_READ_TOKEN is required for scheduled ingestion" >&2
            exit 1
          fi
          if [ -z "$OMDB_API_KEY" ]; then
            echo "OMDB_API_KEY is required for Rotten Tomatoes and Metacritic enrichment" >&2
            exit 1
          fi
          printf '%s' "$TMDB_READ_TOKEN" | npx --yes wrangler@4 secret put TMDB_READ_TOKEN
          printf '%s' "$OMDB_API_KEY" | npx --yes wrangler@4 secret put OMDB_API_KEY
          if [ -n "$MDBLIST_API_KEY" ]; then
            printf '%s' "$MDBLIST_API_KEY" | npx --yes wrangler@4 secret put MDBLIST_API_KEY
          fi
      - name: Deploy Worker
        working-directory: tmdb-search-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
