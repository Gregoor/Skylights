name: TMDBSpotlight
options:
  bundleIdPrefix: com.tinycast
  deploymentTarget:
    iOS: "26.0"
targets:
  TMDBSpotlight:
    type: application
    platform: iOS
    sources:
      - App
      - App/Assets.xcassets
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinycast.tmdbspotlight
        PRODUCT_NAME: TMDB Spotlight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: TMDB Spotlight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        OTHER_LDFLAGS: "$(inherited) -lz"
        SWIFT_OBJC_BRIDGING_HEADER: Core/Gzip.h
        ENABLE_APP_SANDBOX: YES
    info:
      path: App/Info.plist
      properties:
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.tinycast.tmdbspotlight.refresh
          - com.tinycast.tmdbspotlight.processing
          - com.tinycast.tmdbspotlight.full-index
