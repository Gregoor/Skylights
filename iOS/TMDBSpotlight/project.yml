name: TMDBSpotlight
options:
  bundleIdPrefix: com.tinycast
  deploymentTarget:
    iOS: "16.0"
targets:
  TMDBSpotlight:
    type: application
    platform: iOS
    sources:
      - App
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinycast.tmdbspotlight
        PRODUCT_NAME: TMDB Spotlight
        INFOPLIST_KEY_CFBundleDisplayName: TMDB Spotlight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        OTHER_LDFLAGS: "$(inherited) -lz"
        SWIFT_OBJC_BRIDGING_HEADER: Core/Gzip.h
        ENABLE_APP_SANDBOX: YES
    info:
      path: App/Info.plist
      properties:
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: []
